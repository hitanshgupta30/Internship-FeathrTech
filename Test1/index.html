<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #794866;
        }

        .container {
            text-align: center;
            background-color: #d68888;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 9px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }

        .fade-out {
            opacity: 0;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><i>Hello World</i> 😍</h1>
        <button class="btn">Click me</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
