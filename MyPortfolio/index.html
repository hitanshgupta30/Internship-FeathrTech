<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hitansh Portfolio</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>My Portfolio✨</h1>
      <button id="theme-toggle" aria-label="Toggle Theme">🌙</button>
    </header>

    <main>
      <div id="info-panel">
        <button id="close-btn">&times;</button> <h2 id="panel-title"></h2>
        <p id="panel-content"></p>
      </div>
      <svg
        class="connections"
        viewBox="0 0 1000 700"
        preserveAspectRatio="none"
      >
        <!-- Projects -->
        <path d="M500 350 C500 270 500 180 550 90" />

        <!-- About -->
        <path d="M500 350 C440 30 300 230 120 225" />

        <!-- Skills -->
        <path d="M500 350 C570 20 700 310 880 230" />

        <!-- Strengths -->
        <path d="M500 350 C360 350 220 280 70 400" />

        <!-- Contact -->
        <path d="M500 350 C640 350 780 450 950 360" />

        <!-- Education -->
        <path d="M500 350 C420 430 320 520 220 610" />

        <!-- Experience -->
        <path d="M500 350 C580 440 680 370 760 610" />
      </svg>
      <section class="center-card">
        <img src="assets/profile.jpg" alt="Hitansh Gupta" />

        <h2>Hitansh Gupta</h2>

        <p>Full Stack Developer</p>
      </section>

      <!-- Nodes -->

      <div class="node projects">Projects</div>

      <div class="node about">About Me</div>

      <div class="node skills">Skills</div>

      <div class="node strengths">Strengths</div>

      <div class="node contact">Contact</div>

      <div class="node education">Education</div>

      <div class="node experience">Experience</div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
