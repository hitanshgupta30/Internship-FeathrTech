<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a5cc81;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .manager-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #2e4d14;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #7da657;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #4CAF50;
        }

        button {
            padding: 10px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background-color: #f9f9f9;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s, transform 0.1s;
        }

        li:hover {
            background-color: #ffebee;
            border-color: #ffcdd2;
            color: #c62828;
        }

        li:hover::after {
            content: 'Click to remove';
            font-size: 11px;
            color: #d32f2f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="manager-card">
        <h2>Student List Manager</h2>
        
        <div class="input-group">
            <input type="text" id="studentInput" placeholder="Enter student name...">
            <button id="addBtn">Add Student</button>
        </div>

        <ul id="studentList"></ul>
    </div>

    <script src="script.js"></script>
    </body>
</html>
