<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Background Color</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .centered-container {
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: solid black;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid black;
            background-color: white;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
        }

        button:hover {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="centered-container">
        <h1>Press the button to change the bg color.</h1>
        <button id="colorBtn">Change Color</button>
    </div>
    <script src="script.js"> </script>

</body>
</html>
